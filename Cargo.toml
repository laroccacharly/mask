[package]
name = "mask"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.6.6", features = ["derive"] }
encoding_rs = "0.8"
gaze-assembly = "0.12.0"
gaze-pii = "0.12.0"
gaze-recognizers = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tower-http = { version = "0.6", features = ["fs"] }
gliner25-rs = "0.5.6"
hf-hub = "0.4.3"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std"] }
pdf-extract = "0.12.0"
reqwest = { version = "0.13.4", features = ["blocking"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
zip = "8.6.0"

[target.'cfg(target_os = "macos")'.dependencies]
candle-pipelines = { version = "0.0.7", features = ["metal"] }
llama-cpp-2 = { version = "0.1.156", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-pipelines = "0.0.7"
llama-cpp-2 = { version = "0.1.156", features = ["vulkan"] }

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"

[patch.crates-io]
gaze-recognizers = { path = "vendor/gaze-recognizers" }
